<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NIGHTFALL — CAR 04 // THE PAINTED COUNTRY</title>
    <style>
      /* The page is part of the art direction: the game sits on a sheet, not
         on a black screen. */
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #efece2;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8d8579;
      }
      /* The car fills the window. Phaser is on Scale.FIT, so it scales the
         960x600 design up to whatever room it is given and letterboxes the
         remainder — the layout stays exact, it just gets bigger. */
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        /* A sheet laid on a desk: a soft contact shadow, no glow. Dropped when
           the canvas is the whole screen — there is no desk left to sit on. */
        box-shadow: 0 1px 2px rgba(74, 70, 64, 0.14), 0 18px 44px rgba(74, 70, 64, 0.16);
      }
      :fullscreen #game canvas,
      :-webkit-full-screen #game canvas { box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <script type="module" src="/src/paintedCountry-main.js"></script>
  </body>
</html>
