<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c130d" />
    <title>NIGHTFALL — The Painted Country</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      /* The page is part of the art direction: Rosa's sheet lies on the same
         walnut as Chapter 1's carriage wall, inside a thin brass rule. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #1c130d;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        color: #eadfc6;
      }
      /* The car fills the window. Phaser is on Scale.FIT, so it scales the
         960x600 design up to whatever room it is given and letterboxes the
         remainder — the layout stays exact, it just gets bigger. */
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        outline: none;
        /* A sheet laid on the walnut: a brass hairline and a warm lamp shadow.
           Dropped when the canvas is the whole screen. */
        box-shadow: 0 0 0 1px rgba(176, 138, 74, 0.55), 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 120px rgba(224, 162, 74, 0.08);
      }
      :fullscreen #game canvas,
      :-webkit-full-screen #game canvas { box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <script type="module" src="/src/paintedCountry-main.js"></script>
  </body>
</html>
