    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #07070a;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Fit the 1280×800 (16:10) stage inside any window, as large as it
         goes (alpha R3 · R7: capped at 1280×800 the HUD type read tiny on a
         1600×900 screen). */
      #game {
        width: min(100vw, calc(100vh * 1.6));
        height: min(100vh, calc(100vw / 1.6));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85);
      }
      .embedded body { background: #07090b; overflow: hidden; }
      .embedded #game {
        width: 100vw;
        height: 100vh;
        box-shadow: none;
      }
      .embedded #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        object-fit: contain;
      }
    </style>
  </head>
