<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>NIGHTFALL — The Last Archive Line</title>
    <meta name="theme-color" content="#030608" />
    <meta name="description" content="NIGHTFALL — The Last Archive Line" />
    <link rel="preload" as="image" href="/assets/ui/nightfall-title-background.png" fetchpriority="high" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #04060a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #6b7684;
        overflow: hidden;
      }
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 18px;
      }
      body:has(#nightfall-title) #app { visibility: hidden; }
      #game canvas {
        display: block;
        border-radius: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
