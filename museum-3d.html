<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>NIGHTFALL — The Museum of One Answer</title>
    <style>
      /* Shared language: src/shell/uiKit.css (.nf-caption, .nf-card, .nf-tag),
         imported by the page script. This sheet only places the museum's
         own layers: reticle, entry overlay, fade, and the framed exhibit. */
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0b0d;
        overflow: hidden;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      .hud { position: fixed; pointer-events: none; z-index: 10; }

      #version-label {
        top: 10px; left: 12px;
        color: #8f8f8f; font: 11px 'Space Mono', monospace; letter-spacing: 0.08em;
      }
      #runtime-coordinates {
        top: 30px; left: 12px;
        padding: 7px 9px;
        color: #c2cad2; background: rgba(5, 8, 11, 0.82);
        border: 1px solid rgba(151, 166, 179, 0.34);
        font: 700 11px/1.45 'Space Mono', monospace;
        letter-spacing: 0.04em; white-space: pre-line;
      }

      #reticle {
        top: 50%; left: 50%;
        width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(240, 240, 230, 0.9);
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      }

      /* the interactable's paper tag: placed by InteractionSystem */
      #prompt.nf-tag { left: 50%; top: 44%; white-space: nowrap; transition: left 60ms linear, top 60ms linear; }
      #prompt[hidden] { display: none; }

      /* dialogue captions: DialogueSystem toggles display */
      #subtitle.nf-caption { display: none; pointer-events: none; }
      #subtitle .nf-caption__choice b { color: var(--nf-amber); margin-right: 6px; }
      #subtitle .nf-caption__silence { color: #9d927c; font: calc(13px * var(--nf-scale)) var(--nf-mono); letter-spacing: 0.08em; align-self: center; }

      .nf-card-backdrop[hidden] { display: none; }
      .museum-card-backdrop { background: rgba(5, 4, 3, 0.5); }

      #echo-minimap {
        top: 42px; right: 18px; width: 190px; max-width: 190px;
        position: fixed; z-index: 16; overflow: hidden; pointer-events: none;
        color: #d7c59d;
      }
      #echo-minimap[hidden] { display: none; }
      #echo-minimap .map-title { margin: 0 0 5px 2px; font: 10px 'Space Mono', monospace; letter-spacing: 0.13em; }
      #echo-minimap canvas { width: 190px !important; height: 158px !important; display: block; }

      /* entry / resume overlay: a title card on the carriage wall */
      #lock-overlay {
        position: fixed; inset: 0; z-index: 20;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 45%, rgba(40, 27, 16, 0.55), rgba(5, 4, 3, 0.86) 70%);
        cursor: pointer;
      }
      #lock-overlay .inner {
        color: var(--nf-ivory); text-align: center;
        padding: 30px 48px 26px;
        border: 2px solid var(--nf-brass); border-radius: 10px;
        background: linear-gradient(180deg, rgba(28, 19, 13, 0.95), rgba(20, 13, 9, 0.96));
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(217, 181, 110, 0.25);
      }
      #lock-overlay .kicker { font: calc(14px * var(--nf-scale)) var(--nf-mono); letter-spacing: 0.4em; color: var(--nf-amber); margin: 0 0 10px; }
      #lock-overlay .title { font: calc(44px * var(--nf-scale)) / 1 var(--nf-display); letter-spacing: 0.08em; margin-bottom: 14px; }
      #lock-overlay .rule { width: 300px; height: 2px; margin: 0 auto 16px; background: linear-gradient(90deg, transparent, var(--nf-brass), transparent); }
      #lock-overlay .hint { font: calc(13px * var(--nightfall-text-scale, 1)) / 1.9 var(--nf-mono); letter-spacing: 0.08em; color: #cdbf9f; }
      #lock-overlay .hint b { color: var(--nf-amber); letter-spacing: 0.2em; }
      #lock-overlay.resume .inner { padding: 18px 30px; }
      #lock-overlay.resume .kicker, #lock-overlay.resume .rule { display: none; }
      #lock-overlay.hidden { display: none; }

      #fade {
        position: fixed; inset: 0; z-index: 30;
        background: #050608;
        opacity: 0; pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #fade.on { opacity: 1; pointer-events: all; }
      #fade .chapter-completion {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 8vw; box-sizing: border-box;
        color: var(--nf-ivory); text-align: center; opacity: 0;
        transition: opacity 0.45s ease;
      }
      #fade .chapter-completion.visible { opacity: 1; }
      #fade .chapter-completion div { color: #c9bb9a; font: calc(20px * var(--nf-scale)) var(--nf-serif); font-style: italic; }
      #fade .chapter-completion strong { font: calc(clamp(20px, 2.6vw, 34px) * var(--nf-scale)) var(--nf-display); letter-spacing: 0.1em; }
      #fade .chapter-completion small { color: var(--nf-amber); font: calc(13px * var(--nf-scale)) var(--nf-mono); letter-spacing: 0.12em; }

      /* ---- the framed exhibit: a carriage window set into the walnut wall ---- */
      #direction-exhibit {
        position: fixed; inset: 0; z-index: 50;
        display: none; align-items: center; justify-content: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(224, 162, 74, 0.14), transparent 45%),
          repeating-linear-gradient(90deg, #1c130d 0 38px, #20160f 38px 41px, #1a110b 41px 80px),
          #1c130d;
        color: var(--nf-ivory);
      }
      #direction-exhibit.open { display: flex; }
      #direction-shell {
        position: relative;
        width: min(94vw, calc((100vh - 60px) * 1.7778 + 40px), 1400px);
        aspect-ratio: 16 / 9.4;
        max-height: calc(100vh - 36px);
        padding: 44px 20px 20px;
        box-sizing: border-box;
        border-radius: 26px;
        background: linear-gradient(180deg, #2c1d13, #1c130d 60%, #150e09);
        box-shadow:
          0 0 0 3px #5e4522, 0 0 0 6px #b08a4a, 0 0 0 9px #3d2c15,
          0 30px 90px rgba(0, 0, 0, 0.8), inset 0 2px 0 rgba(217, 181, 110, 0.18);
      }
      /* brass rivets round the bezel */
      #direction-shell::before {
        content: ''; position: absolute; inset: 12px; border-radius: 18px; pointer-events: none;
        background:
          radial-gradient(circle, #e3c27e 0 3px, #5e4522 4px, transparent 5px) 0 0 / 64px 64px repeat-x,
          radial-gradient(circle, #e3c27e 0 3px, #5e4522 4px, transparent 5px) 0 100% / 64px 64px repeat-x;
        background-size: 64px 10px, 64px 10px;
        background-position: 20px 0, 20px 100%;
        opacity: 0.8;
      }
      #direction-title {
        position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
        padding: 4px 18px; border-radius: 4px;
        background: linear-gradient(180deg, #e3c27e, #b08a4a 45%, #8a6934);
        color: #2a1d14; font: 700 calc(12px * var(--nf-scale)) var(--nf-mono); letter-spacing: 0.18em;
        white-space: nowrap; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      }
      #direction-frame {
        width: 100%; height: 100%; display: block; border: 0;
        border-radius: 16px; background: #0b0705;
        box-shadow: inset 0 0 0 2px #5e4522, 0 0 0 2px #b08a4a;
      }
      #direction-close {
        position: absolute; right: 22px; top: 8px;
        width: 30px; height: 30px; border-radius: 50%;
        border: 1px solid #b08a4a; background: #2a1d14; color: var(--nf-ivory);
        font: 16px var(--nf-serif); cursor: pointer; line-height: 1;
      }
      #direction-close:hover, #direction-close:focus-visible { border-color: var(--nf-amber); outline: none; }
      #direction-status {
        position: absolute; left: 26px; top: 14px;
        font: calc(11px * var(--nf-scale)) var(--nf-mono); letter-spacing: 0.14em; color: #b9a583;
      }
      #direction-translation {
        position: absolute; inset: 44px 20px 20px; z-index: 3;
        display: grid; place-items: center; border-radius: 16px;
        background: radial-gradient(circle at 50% 40%, rgba(60, 40, 24, 0.9), rgba(12, 8, 5, 0.96));
        opacity: 0; pointer-events: none; transition: opacity 260ms ease;
      }
      #direction-exhibit.translating #direction-translation { opacity: 1; pointer-events: auto; }
      #direction-exhibit.translating #direction-frame { pointer-events: none; }
      #direction-translation .nf-card { text-align: left; }
      #direction-begin {
        margin-top: 18px; padding: 10px 18px;
        border: 1px solid #6b5640; border-radius: 4px; background: #2a1d14; color: var(--nf-ivory);
        font: 700 calc(13px * var(--nf-scale)) var(--nf-mono); letter-spacing: 0.16em; cursor: pointer;
      }
      #direction-begin:hover, #direction-begin:focus-visible { border-color: var(--nf-amber); background: #3a2718; outline: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="version-label" class="hud" hidden>MUSEUM OF ONE ANSWER · DEV</div>
    <div id="runtime-coordinates" class="hud" hidden aria-live="off">X 0.00 · MAP-Y(Z) 0.00 · LOADING</div>
    <div id="reticle" class="hud"></div>
    <div id="prompt" class="nf-tag" hidden></div>
    <div id="subtitle" class="nf-caption" aria-live="polite"></div>
    <aside id="echo-minimap" class="hud" hidden aria-label="Echo City map (dev preview)">
      <div class="map-title">ECHO CITY · DEV PREVIEW</div>
      <canvas id="echo-minimap-canvas" width="190" height="158"></canvas>
    </aside>
    <div id="lock-overlay">
      <div class="inner">
        <p class="kicker">CHAPTER 5</p>
        <div class="title">THE MUSEUM OF ONE ANSWER</div>
        <div class="rule"></div>
        <div class="hint">
          <b>CLICK TO ENTER</b><br />
          WASD — WALK · MOUSE — LOOK · SPACE — JUMP<br />
          E — INTERACT · ESC — PAUSE
        </div>
      </div>
    </div>
    <div id="fade"><div class="chapter-completion" aria-live="polite"></div></div>
    <section id="direction-exhibit" aria-hidden="true">
      <div id="direction-shell">
        <div id="direction-title">ARCHIVAL RECONSTRUCTION</div>
        <div id="direction-status">ESC</div>
        <button id="direction-close" type="button" aria-label="Return to the museum">×</button>
        <iframe id="direction-frame" title="Chapter 5 framed exhibit"></iframe>
        <div id="direction-translation" aria-hidden="true">
          <div class="nf-card">
            <p class="nf-card__stamp" id="direction-mode">THE MUSEUM OF ONE ANSWER</p>
            <p class="nf-card__lines" id="direction-copy"></p>
            <button id="direction-begin" type="button">BEGIN</button>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="/src/chapters/museum3d/museum3d-main.js"></script>
  </body>
</html>
