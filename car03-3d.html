<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NIGHTFALL — Echo City</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#140d09" />
    <style>
      /* Page shell only; the Echo City HUD lives in
         src/cars/presentCity3d/chapter3Release.css on top of the shared
         src/shell/uiKit.css. TEXT SIZE scales it via
         var(--nightfall-text-scale, 1). */
      :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; background: #140d09; color: #eadfc6; }
      * { box-sizing: border-box; }
      html, body, #city-3d { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #140d09; }
      canvas { display: block; width: 100%; height: 100%; outline: none; cursor: default; }
      canvas.interaction-hover { cursor: pointer; }
      .clear-afternoon canvas { filter: saturate(.92) brightness(1.03) contrast(1.12); }
      .c3-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="city-3d" aria-label="Echo City"></div>
    <div class="c3-sr-only" id="runtime-status" aria-live="polite">LOADING</div>
    <div class="c3-loading" id="loading-panel">
      <p class="c3-loading__kicker">CHAPTER 3 · ECHO CITY</p>
      <div class="c3-loading__copy">
        <span id="loading-label">LOADING THE CITY</span>
        <span id="loading-count">0 / 30</span>
      </div>
      <div class="c3-loading__track"><div class="c3-loading__fill" id="loading-fill"></div></div>
    </div>
    <aside class="c3-objective" id="objective-card" aria-live="polite">
      <span class="c3-objective__kicker">NOW</span>
      <span class="c3-objective__title" id="objective-title">STEP OFF THE NIGHT SERVICE</span>
    </aside>
    <section class="nf-caption c3-caption" id="dialogue-caption" hidden></section>
    <section class="c3-evidence" id="evidence-viewer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="evidence-title" hidden></section>
    <section class="c3-sunrise" id="sunrise-tableau" aria-hidden="true">
      <img src="/src/cars/presentCity3d/assets/ch03-sunrise-overlook-oil-v1.png" alt="Butch and Lev seen from behind on a bench above Echo City at sunrise" />
      <button class="nf-card__close c3-sunrise__continue" id="sunrise-tableau-continue" type="button" disabled hidden>CONTINUE · E</button>
    </section>
    <div class="c3-blackout" id="chapter-blackout"></div>
    <div class="c3-vignette"></div>
    <script type="module" src="/src/car03-3d-main.js"></script>
  </body>
</html>
