# Builds the NIGHTFALL desktop packages on GitHub's own macOS, Windows and
# Linux runners, so nobody needs a local toolchain for every platform.
# Trigger: any push to a release/* branch, a v* tag, or "Run workflow" in the
# Actions tab. Results: Actions → the run → Artifacts (kept 14 days).
#
# macOS builds are ad-hoc signed (identity "-") so they open on Apple Silicon
# after "right-click → Open". For a notarized build add APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID and CSC_LINK / CSC_KEY_PASSWORD
# repository secrets and drop the identity override (see desktop/README.md).
name: desktop-release

on:
  push:
    branches: ['release/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: npx electron-builder --mac --universal --publish never -c.mac.identity=-
            artifact: nightfall-macos
            files: |
              release/desktop/*.dmg
              release/desktop/*-mac*.zip
          - os: windows-latest
            script: npx electron-builder --win --x64 --publish never
            artifact: nightfall-windows
            files: |
              release/desktop/*-win-setup.exe
              release/desktop/*-win-x64.zip
          - os: ubuntu-latest
            script: npx electron-builder --linux --x64 --publish never
            artifact: nightfall-linux
            files: |
              release/desktop/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/desktop/*.test.mjs
      - run: npm run build
      - run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 14
          compression-level: 0

  # A public pre-release with the three packages, so playtesters can download
  # without a GitHub account: Releases → "NIGHTFALL playtest <n>". Runs after
  # all three packages built. The playtest build keeps the 1111 test router.
  publish:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: ls -la packages
      # The gh CLI, not softprops/action-gh-release: on run #2 the release API
      # answered 500 once and then three of the five large uploads died with
      # no retry. Here every file is uploaded on its own with retries, and the
      # job fails only if a file is still missing at the end.
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: playtest-${{ github.run_number }}
          TITLE: NIGHTFALL playtest ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          cat > notes.md <<'NOTES'
          NIGHTFALL — playtest build

          **Mac:** download the `.dmg` (or `-mac-universal.zip`), drag NIGHTFALL to Applications. First launch: right-click the app → **Open** → **Open** (the build is not notarized yet).
          **Windows:** download `-win-setup.exe` (or the `-win-x64.zip`). If SmartScreen warns, click **More info → Run anyway**.
          **Linux:** download the `.AppImage`, `chmod +x` it, run it.

          About 3.5–4.5 hours; saves are automatic (CONTINUE). Settings has LOW GRAPHICS for slower computers. On the title screen, typing 1 1 1 1 opens the test router.

          **Mac：** 下载 `.dmg`，把 NIGHTFALL 拖进「应用程序」。第一次打开：右键点 App →「打开」→「打开」（还没做苹果公证）。
          **Windows：** 下载 `-win-setup.exe`。如果 SmartScreen 拦截，点「更多信息 → 仍要运行」。
          存档自动保存（继续游戏）。电脑比较慢可以在设置里打开 LOW GRAPHICS。
          NOTES
          echo "Build: $SHA" >> notes.md
          # a re-run of this job starts clean
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            gh release create "$TAG" --target "$SHA" --title "$TITLE" --notes-file notes.md --prerelease && break
            echo "create failed (attempt $attempt), retrying"; sleep $((attempt * 10))
          done
          missing=0
          for f in packages/*; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; echo "uploaded $f"; break; fi
              echo "upload of $f failed (attempt $attempt), retrying"; sleep $((attempt * 15))
            done
            [ "$ok" = 1 ] || { echo "::error::could not upload $f"; missing=1; }
          done
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
          exit $missing
