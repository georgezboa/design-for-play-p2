<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0806" />
    <title>NIGHTFALL — All Worlds at Once</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/chapters/finalBoss/style.css" />
  </head>
  <body class="nf-finale">
    <main class="game-shell">
      <section class="stage-wrap" aria-label="All Worlds at Once">
        <div id="game"></div>
        <div id="menu" class="nf-overlay">
          <div class="nf-board">
            <p class="nf-board__kicker">CHAPTER 6 · THE LAST CARRIAGE</p>
            <h1 class="nf-board__title">ALL WORLDS AT ONCE</h1>
            <div class="nf-board__rule"></div>
            <p class="nf-board__intro">The Conductor keeps the line running. Outlast his four movements, one for every carriage you have already ridden.</p>
            <div class="nf-board__settings">
              <fieldset><legend>DIFFICULTY</legend><div class="nf-segmented" id="difficulty">
                <button type="button" data-value="story">STORY<small>6 layers · slower</small></button><button type="button" class="active" data-value="normal">NORMAL<small>4 layers</small></button>
              </div></fieldset>
              <fieldset><legend>CAMERA SHAKE</legend><div class="nf-segmented" id="shake"><button type="button" class="active" data-value="on">ON</button><button type="button" data-value="off">OFF</button></div></fieldset>
              <fieldset><legend>FLASHING</legend><div class="nf-segmented" id="flash"><button type="button" data-value="on">ON</button><button type="button" class="active" data-value="off">OFF</button></div></fieldset>
            </div>
            <button id="start" class="nf-ticket-button" type="button">DEPART <span>→</span></button>
            <p class="nf-board__controls"><b>MOVE</b> WASD / ARROWS <i></i> <b>PUNCH</b> SPACE <i></i> <b>DASH</b> SHIFT / X <i></i> <b>PAUSE</b> ESC</p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/chapters/finalBoss/spectacleBattle.js"></script>
  </body>
</html>
