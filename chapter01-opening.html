<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Nightfall — Opening to Chapter 1</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #03050a; color: #d7e2ee; }
      body { display: grid; place-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { width: min(96vw, 1100px); padding: 24px 0; }
      header { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin: 0 0 12px; }
      h1 { margin: 0; font-size: clamp(14px, 2vw, 20px); font-weight: 500; letter-spacing: .16em; }
      header p { margin: 0; color: #7d8896; font-size: 11px; letter-spacing: .08em; text-align: right; }
      .player { position: relative; background: #000; border: 1px solid #29313d; box-shadow: 0 22px 70px #000b; }
      video { display: block; width: 100%; aspect-ratio: 16 / 10; background: #000; }
      .handoff { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: #9aa6b5; font-size: 12px; line-height: 1.45; }
      a { color: #f0d164; text-decoration: none; border: 1px solid #a98b22; padding: 10px 14px; letter-spacing: .08em; white-space: nowrap; }
      a:hover, a:focus-visible { background: #a98b22; color: #04060a; outline: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>OPENING // THE NIGHT SERVICE REMEMBERS</h1>
        <p>preview ends on the literal Chapter 1 first frame</p>
      </header>
      <section class="player" aria-label="Chapter 1 opening cinematic">
        <video id="opening" controls autoplay muted playsinline preload="metadata"
          poster="/chapter01-opening/CH01_CORRECT_BACKGROUND_CINEMATIC_TARGET_V01.png">
          <source src="/chapter01-opening/opening-animation-v01/NIGHTFALL_OPENING_ANIMATION_PREVIEW_V01.mp4" type="video/mp4" />
          Your browser cannot play this opening preview.
        </video>
      </section>
      <div class="handoff">
        <span id="status">The preview is muted by default. Enable sound in the player controls.</span>
        <a href="/?chapter=0">ENTER CHAPTER 1</a>
      </div>
    </main>
    <script type="module">
      import { installDevMenuReturnControl } from '/src/devMenuReturn.js';
      installDevMenuReturnControl();

      const opening = document.getElementById('opening');
      const status = document.getElementById('status');
      opening.addEventListener('play', () => { status.textContent = 'The last 1.5 seconds are the literal Chapter 1 first frame.'; });
      opening.addEventListener('ended', () => { status.textContent = 'Opening complete. Enter Chapter 1 when you are ready.'; });
      window.render_game_to_text = () => JSON.stringify({
        page: 'chapter-01-opening-preview',
        video: { currentTime: Number(opening.currentTime.toFixed(2)), duration: Number(opening.duration.toFixed(2)) || null, ended: opening.ended, muted: opening.muted },
        handoff: '/?chapter=0',
      });
    </script>
  </body>
</html>
